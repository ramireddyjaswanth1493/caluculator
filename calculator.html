<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimalist Dark Mode Calculator</title>

  <style>
    /* --------------------------------------------------------------------------
       1. STYLING & CSS GRID LAYOUT
       -------------------------------------------------------------------------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0f172a; /* Dark background */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      user-select: none;
    }

    /* Calculator Shell */
    .calculator {
      background-color: #1e293b;
      padding: 24px;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 320px;
    }

    /* Screen Display */
    .display {
      background-color: #0f172a;
      border-radius: 16px;
      padding: 20px;
      text-align: right;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .display-history {
      font-size: 0.9rem;
      color: #94a3b8;
      min-height: 20px;
      margin-bottom: 4px;
    }

    .display-current {
      font-size: 2.25rem;
      font-weight: 300;
      color: #ffffff;
      word-break: break-all;
    }

    /* CSS Grid Keypad (4 columns) */
    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    /* Button Styling */
    button {
      height: 60px;
      border: none;
      outline: none;
      border-radius: 16px;
      font-size: 1.3rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.08s ease;
    }

    button:active {
      transform: scale(0.94); /* Press bounce effect */
    }

    /* Number Keys (0-9) */
    .btn-number {
      background-color: #334155;
      color: #ffffff;
    }
    .btn-number:hover {
      background-color: #475569;
    }

    /* Function Keys (C, ±, %) */
    .btn-function {
      background-color: #475569;
      color: #f8fafc;
    }
    .btn-function:hover {
      background-color: #64748b;
    }

    /* Operator Keys (+, -, *, /, =) */
    .btn-operator {
      background-color: #f59e0b; /* Amber orange */
      color: #ffffff;
    }
    .btn-operator:hover {
      background-color: #d97706;
    }

    /* Zero key spans 2 columns */
    .btn-zero {
      grid-column: span 2;
    }
  </style>
</head>
<body>

  <!-- ------------------------------------------------------------------------
       2. HTML STRUCTURE
       ------------------------------------------------------------------------ -->
  <div class="calculator">
    
    <!-- Screen Display -->
    <div class="display">
      <div id="historyDisplay" class="display-history"></div>
      <div id="currentDisplay" class="display-current">0</div>
    </div>

    <!-- 4x5 Keypad Grid -->
    <div class="keypad">
      <!-- Row 1 -->
      <button class="btn-function" onclick="clearCalculator()">AC</button>
      <button class="btn-function" onclick="toggleSign()">±</button>
      <button class="btn-function" onclick="makePercentage()">%</button>
      <button class="btn-operator" onclick="chooseOperator('÷')">÷</button>

      <!-- Row 2 -->
      <button class="btn-number" onclick="appendNumber('7')">7</button>
      <button class="btn-number" onclick="appendNumber('8')">8</button>
      <button class="btn-number" onclick="appendNumber('9')">9</button>
      <button class="btn-operator" onclick="chooseOperator('×')">×</button>

      <!-- Row 3 -->
      <button class="btn-number" onclick="appendNumber('4')">4</button>
      <button class="btn-number" onclick="appendNumber('5')">5</button>
      <button class="btn-number" onclick="appendNumber('6')">6</button>
      <button class="btn-operator" onclick="chooseOperator('−')">−</button>

      <!-- Row 4 -->
      <button class="btn-number" onclick="appendNumber('1')">1</button>
      <button class="btn-number" onclick="appendNumber('2')">2</button>
      <button class="btn-number" onclick="appendNumber('3')">3</button>
      <button class="btn-operator" onclick="chooseOperator('+')">+</button>

      <!-- Row 5 -->
      <button class="btn-number btn-zero" onclick="appendNumber('0')">0</button>
      <button class="btn-number" onclick="appendDecimal()">.</button>
      <button class="btn-operator" onclick="calculate()">=</button>
    </div>

  </div>

  <!-- ------------------------------------------------------------------------
       3. JAVASCRIPT LOGIC
       ------------------------------------------------------------------------ -->
  <script>
    // Grab the screen elements from HTML
    const currentDisplay = document.getElementById('currentDisplay');
    const historyDisplay = document.getElementById('historyDisplay');

    // Calculator memory (State)
    let currentNumber = '0';
    let previousNumber = '';
    let selectedOperator = null;
    let shouldResetScreen = false;

    // 1. Append a number when a digit is clicked
    function appendNumber(num) {
      if (shouldResetScreen) {
        currentNumber = '';
        shouldResetScreen = false;
      }

      // Avoid typing multiple leading zeroes
      if (currentNumber === '0' && num === '0') return;

      // Replace initial 0 with the typed digit
      if (currentNumber === '0') {
        currentNumber = num;
      } else {
        currentNumber += num;
      }
      updateScreen();
    }

    // 2. Append a decimal point (.) safely
    function appendDecimal() {
      if (shouldResetScreen) {
        currentNumber = '0';
        shouldResetScreen = false;
      }
      // Only allow one decimal point
      if (!currentNumber.includes('.')) {
        currentNumber += '.';
      }
      updateScreen();
    }

    // 3. Select an operator (+, −, ×, ÷)
    function chooseOperator(operator) {
      // If user chains operations (e.g. 5 + 3 + ...), calculate intermediate result first
      if (previousNumber !== '' && !shouldResetScreen) {
        calculate();
      }

      selectedOperator = operator;
      previousNumber = currentNumber;
      shouldResetScreen = true;
      updateScreen();
    }

    // 4. Perform calculation without unsafe eval()
    function calculate() {
      if (selectedOperator === null || shouldResetScreen) return;

      const prev = parseFloat(previousNumber);
      const current = parseFloat(currentNumber);
      let result = 0;

      switch (selectedOperator) {
        case '+':
          result = prev + current;
          break;
        case '−':
          result = prev - current;
          break;
        case '×':
          result = prev * current;
          break;
        case '÷':
          if (current === 0) {
            currentNumber = 'Error';
            previousNumber = '';
            selectedOperator = null;
            shouldResetScreen = true;
            updateScreen();
            return;
          }
          result = prev / current;
          break;
        default:
          return;
      }

      // Round to prevent floating point quirks (e.g., 0.1 + 0.2 = 0.3)
      currentNumber = Math.round((result + Number.EPSILON) * 1e10) / 1e10;
      previousNumber = '';
      selectedOperator = null;
      shouldResetScreen = true;
      updateScreen();
    }

    // 5. Clear all (AC)
    function clearCalculator() {
      currentNumber = '0';
      previousNumber = '';
      selectedOperator = null;
      shouldResetScreen = false;
      updateScreen();
    }

    // 6. Flip between positive and negative (±)
    function toggleSign() {
      if (currentNumber === '0' || currentNumber === 'Error') return;
      currentNumber = (parseFloat(currentNumber) * -1).toString();
      updateScreen();
    }

    // 7. Convert to percentage (%)
    function makePercentage() {
      if (currentNumber === 'Error') return;
      currentNumber = (parseFloat(currentNumber) / 100).toString();
      updateScreen();
    }

    // 8. Refresh the numbers shown on screen
    function updateScreen() {
      currentDisplay.innerText = currentNumber;
      if (selectedOperator !== null) {
        historyDisplay.innerText = `${previousNumber} ${selectedOperator}`;
      } else {
        historyDisplay.innerText = '';
      }
    }
  </script>

</body>
</html>
